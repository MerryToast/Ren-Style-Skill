# Tier weights used in stylometry (see docs/design_notes.md §1)
tier_weights:
  S: 3.0   # designated core exemplars
  A: 1.0   # Ren first author
  B: 0.3   # Ren corresponding author only (students first author) -> reference / secondary validation

# Style policy (see docs/design_notes.md §2.2) — decided: imitate style, fix grammar
